name: Resolve NADMO DNS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/resolve-nadmo-dns.yml"]
jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve
        run: |
          echo "relay"
          getent ahostsv4 relay.nadmo.id | head -3 || true
          echo "bidigi"
          getent ahostsv4 bidigi.nadmo.id | head -3 || true
          echo "agent"
          getent ahostsv4 agent.nadmo.id | head -3 || true\n          getent ahostsv6 agent.nadmo.id | head -3 || true\n          echo "relay-v6"\n          getent ahostsv6 relay.nadmo.id | head -3 || true

name: Verify VPS Egress IP

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-vps-egress.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
    steps:
      - name: Configure SSH diagnostics
        shell: bash
        env:
          KEY_OLD: ${{ secrets.VPS_SSH_KEY }}
          KEY_NEW: ${{ secrets.NADMO_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          printf '%s\n' "$KEY_OLD" > ~/.ssh/key_old
          printf '%s\n' "$KEY_NEW" > ~/.ssh/key_new
          chmod 600 ~/.ssh/key_old ~/.ssh/key_new

      - name: Find valid SSH user and key
        shell: bash
        run: |
          set -euo pipefail
          found=""
          for key in old new; do
            keyfile="$HOME/.ssh/key_$key"
            for user in root ubuntu debian admin; do
              echo "Trying user=$user key=$key"
              if ssh -o BatchMode=yes -o PasswordAuthentication=no -o ConnectTimeout=8 -i "$keyfile" -p "$VPS_PORT" "$user@$VPS_HOST" 'echo SSH_OK' >/tmp/ssh-ok 2>/dev/null; then
                echo "SSH_LOGIN_USER=$user" >> "$GITHUB_ENV"
                echo "SSH_LOGIN_KEY=$key" >> "$GITHUB_ENV"
                found=1
                break 2
              fi
            done
          done
          if [ -z "$found" ]; then
            echo "::error::No existing GitHub SSH key is authorized for root/ubuntu/debian/admin on this VPS."
            exit 1
          fi
          echo "Authorized SSH login found: user=$SSH_LOGIN_USER key=$SSH_LOGIN_KEY"

      - name: Verify public outbound IPv4
        shell: bash
        run: |
          set -euo pipefail
          keyfile="$HOME/.ssh/key_$SSH_LOGIN_KEY"
          IP="$(ssh -o BatchMode=yes -o PasswordAuthentication=no -i "$keyfile" -p "$VPS_PORT" "$SSH_LOGIN_USER@$VPS_HOST" 'curl -4 --fail --silent --show-error --max-time 20 https://api.ipify.org')"
          echo "OUTBOUND_IPV4=$IP"
          test -n "$IP"

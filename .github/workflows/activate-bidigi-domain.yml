name: Activate BIDIGI Domain
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/activate-bidigi-domain.yml"
  workflow_dispatch:

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
      - name: Activate public domain
        run: |
          set -euo pipefail
          sshpass -p "$VPS_PASSWORD" scp -P "$VPS_PORT" services/bidigi-core/activate_domain.sh "$VPS_USER@$VPS_HOST:/tmp/bidigi-activate.sh"
          sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "chmod +x /tmp/bidigi-activate.sh && /tmp/bidigi-activate.sh"

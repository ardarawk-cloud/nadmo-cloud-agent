name: ACC HQ KAI Core checks
on:
  pull_request:
    paths:
      - 'services/kai-core/**'
      - '.github/workflows/acc-hq-kai-core-tests.yml'
  push:
    branches: [main]
    paths:
      - 'services/kai-core/**'
      - '.github/workflows/acc-hq-kai-core-tests.yml'
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r services/kai-core/requirements.txt
          python -m pip install pytest httpx
      - name: Syntax check
        run: python -m compileall -q services/kai-core
      - name: Auth, persistence, CSRF and completion gate tests
        run: python -m pytest -q services/kai-core/test_app.py

name: Inspect VPS Web Stack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vps-web.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
    steps:
      - name: Inspect listeners and web services
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            echo "=== LISTENERS ==="
            ss -ltnp | grep -E ":(80|443|8791|8792)\b" || true
            echo "=== SERVICES ==="
            systemctl is-active apache2 2>/dev/null || true
            systemctl is-active nadmo-bidigi-core 2>/dev/null || true
            echo "=== BIDIGI ORIGIN HTTP ==="
            curl -sS -i --max-time 20 -H "Host: bidigi.nadmo.id" http://127.0.0.1/api/_healthcheck | head -40 || true
            echo "=== BIDIGI ENV FLAGS ==="
            test -s /etc/nadmo/bidigi.env && echo "env_file=present" || echo "env_file=missing"
            grep -q "^DIGIFLAZZ_USERNAME=..*" /etc/nadmo/bidigi.env 2>/dev/null && echo "digiflazz_username=set" || echo "digiflazz_username=empty"
            grep -q "^DIGIFLAZZ_API_KEY=..*" /etc/nadmo/bidigi.env 2>/dev/null && echo "digiflazz_key=set" || echo "digiflazz_key=empty"
            grep -q "^IPAYMU_VA=..*" /etc/nadmo/bidigi.env 2>/dev/null && echo "ipaymu_va=set" || echo "ipaymu_va=empty"
            grep -q "^IPAYMU_API_KEY=..*" /etc/nadmo/bidigi.env 2>/dev/null && echo "ipaymu_key=set" || echo "ipaymu_key=empty"
            echo "=== APACHE BIDIGI ==="
            apache2ctl -S 2>/dev/null | grep -i bidigi || true
          '
      - name: Check public BIDIGI through Cloudflare
        shell: bash
        run: |
          set +e
          echo "=== PUBLIC HTTP ==="
          curl -sS -i --max-time 20 http://bidigi.nadmo.id/api/_healthcheck | head -50
          echo "=== PUBLIC HTTPS ==="
          curl -sS -i --max-time 20 https://bidigi.nadmo.id/api/_healthcheck | head -50

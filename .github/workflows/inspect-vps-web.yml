name: Inspect VPS Web Stack

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vps-web.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
    steps:
      - name: Inspect listeners and web services
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            echo "=== LISTENERS ==="
            ss -ltnp | grep -E ":(80|443|8791)\b" || true
            echo "=== SERVICES ==="
            systemctl is-active apache2 2>/dev/null || true
            systemctl is-active nginx 2>/dev/null || true
            systemctl is-active caddy 2>/dev/null || true
            echo "=== PROCESSES ==="
            ps -ef | grep -E "apache2|httpd|nginx|caddy|python.*8791" | grep -v grep || true
            echo "=== APACHE SITES ==="
            ls -la /etc/apache2/sites-enabled 2>/dev/null || true
            for f in /etc/apache2/sites-enabled/*.conf; do echo "--- $f"; sed -n "1,220p" "$f"; done 2>/dev/null || true
            echo "=== DOCROOTS ==="
            find /var/www -maxdepth 3 -type f -printf "%p %s bytes\n" 2>/dev/null | head -200 || true
            echo "=== BIDIGI ==="
            grep -Ril "bidigi" /etc/apache2 /var/www /opt/nadmo 2>/dev/null | head -100 || true
            echo "=== BIDIGI OLD SITE ==="
            curl -IL --max-time 20 https://bidigi-shop.ardarawk.chatgpt.site/ 2>/dev/null | head -40 || true
            curl -L --max-time 20 https://bidigi-shop.ardarawk.chatgpt.site/ 2>/dev/null | head -80 || true
            echo "=== BIDIGI DOM TARGETS ==="
            curl -sL --max-time 20 https://bidigi-shop.ardarawk.chatgpt.site/ | sed "s/></>\\n</g" | grep -E "Harga demo|Mode demo|Pulsa 10.000|Paket Data|Top Up Game|E-Wallet|Tagihan|Dashboard Admin|Lihat promo|Pilih produk|data-slot=\\\"button\\\"" | head -260 || true
            echo "=== IPV6 ==="
            ip -6 addr show scope global || true
          '

name: Inspect BIDIGI Digiflazz Cache

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-vps-web.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
    steps:
      - name: Inspect BIDIGI runtime without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

          sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            set -e
            echo "=== SERVICE ==="
            systemctl status nadmo-bidigi-core --no-pager -l 2>/dev/null | head -35 || true

            echo "=== BIDIGI FILES ==="
            find /opt/nadmo -maxdepth 4 -type f 2>/dev/null |
              grep -Ei "bidigi|catalog|product|digiflazz|cache" |
              head -200 || true

            echo "=== BIDIGI SOURCE ENDPOINT HINTS ==="
            grep -RniE "price-list|buyer_sku_code|catalog|products|digiflazz" /opt/nadmo/bidigi* 2>/dev/null |
              grep -vE "API_KEY|PASSWORD|SECRET|TOKEN" |
              head -220 || true

            echo "=== LOCAL HEALTH ==="
            curl -fsS --max-time 15 -H "Host: bidigi.nadmo.id" http://127.0.0.1/api/_healthcheck || true
            echo

            for endpoint in /api/catalog /api/products /api/products?category=eSIM /api/catalog?brand=eSIM /api/digiflazz/products; do
              echo "--- $endpoint"
              curl -sS --max-time 15 -H "Host: bidigi.nadmo.id" "http://127.0.0.1$endpoint" |
                head -c 2500 || true
              echo
            done
          '

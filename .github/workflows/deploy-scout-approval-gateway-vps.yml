name: Deploy Scout Approval Gateway

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/scout-approval-gateway/**"
      - ".github/workflows/deploy-scout-approval-gateway-vps.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate VPS credentials
        shell: bash
        env:
          VPS_KEY: ${{ secrets.NADMO_VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_KEY" ] && [ -z "$VPS_PASSWORD" ]; then
            echo "Set either NADMO_VPS_SSH_KEY or NADMO_VPS_PASSWORD"
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        env:
          VPS_KEY: ${{ secrets.NADMO_VPS_SSH_KEY }}
          VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$VPS_PORT"
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          if [ -n "$VPS_KEY" ]; then
            printf '%s\n' "$VPS_KEY" > ~/.ssh/id_ed25519
            chmod 600 ~/.ssh/id_ed25519
          fi
          if [ -n "$VPS_PASSWORD" ]; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq sshpass
          fi
          echo "AUTH_MODE=auto" >> "$GITHUB_ENV"

      - name: Upload gateway
        shell: bash
        env:
          VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
        run: |
          set -euo pipefail
          tar -C services/scout-approval-gateway -czf /tmp/scout-approval-gateway.tgz .
          upload_ok=0
          if [ -s ~/.ssh/id_ed25519 ]; then
            if scp -o BatchMode=yes -P "$VPS_PORT" /tmp/scout-approval-gateway.tgz "$VPS_USER@$VPS_HOST:/tmp/scout-approval-gateway.tgz"; then
              ssh -o BatchMode=yes -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -rf /tmp/scout-approval-src && mkdir -p /tmp/scout-approval-src && tar -xzf /tmp/scout-approval-gateway.tgz -C /tmp/scout-approval-src"
              upload_ok=1
              echo "AUTH_MODE=key" >> "$GITHUB_ENV"
            fi
          fi
          if [ "$upload_ok" -ne 1 ] && [ -n "$VPS_PASSWORD" ]; then
            sshpass -p "$VPS_PASSWORD" scp -o PreferredAuthentications=password -o PubkeyAuthentication=no -P "$VPS_PORT" /tmp/scout-approval-gateway.tgz "$VPS_USER@$VPS_HOST:/tmp/scout-approval-gateway.tgz"
            sshpass -p "$VPS_PASSWORD" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "rm -rf /tmp/scout-approval-src && mkdir -p /tmp/scout-approval-src && tar -xzf /tmp/scout-approval-gateway.tgz -C /tmp/scout-approval-src"
            upload_ok=1
            echo "AUTH_MODE=password" >> "$GITHUB_ENV"
          fi
          test "$upload_ok" -eq 1

      - name: Deploy and cut over Scout
        shell: bash
        env:
          VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
        run: |
          set -euo pipefail
          REMOTE='chmod +x /tmp/scout-approval-src/deploy_vps.sh; /tmp/scout-approval-src/deploy_vps.sh'
          if [ "$AUTH_MODE" = "key" ]; then
            ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE"
          else
            sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "$REMOTE"
          fi

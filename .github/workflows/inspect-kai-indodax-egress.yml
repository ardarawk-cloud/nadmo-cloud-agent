name: Inspect KAI INDODAX Egress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/inspect-kai-indodax-egress.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect VPS market-data connectivity
        shell: bash
        run: |
          set -euo pipefail
          sshpass -p "$VPS_PASSWORD" ssh -o PreferredAuthentications=password -o PubkeyAuthentication=no -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s" <<'REMOTE'
          set +e
          echo "=== DNS ==="
          getent ahostsv4 indodax.com
          echo "=== EGRESS ==="
          curl -4 -sS --max-time 10 https://api.ipify.org
          echo
          echo "=== INDODAX SERVER TIME ==="
          curl -4 -sS --connect-timeout 5 --max-time 15 -w "\nHTTP=%{http_code} REMOTE=%{remote_ip} SSL=%{ssl_verify_result}\n" https://indodax.com/api/server_time
          echo
          echo "=== INDODAX TICKER ==="
          curl -4 -sS --connect-timeout 5 --max-time 15 -w "\nHTTP=%{http_code} REMOTE=%{remote_ip} SSL=%{ssl_verify_result}\n" https://indodax.com/api/ticker/btcidr
          echo
          echo "=== KAI ENDPOINT ==="
          curl -sS --max-time 15 -w "\nHTTP=%{http_code}\n" http://127.0.0.1:8787/market/ticker/BTCIDR
          echo
          echo "=== KAI SCAN ==="
          curl -sS --max-time 20 -w "\nHTTP=%{http_code}\n" "http://127.0.0.1:8787/market/scan/BTCIDR?timeframe=15"
          echo
          echo "=== KAI AUTO ==="
          curl -sS --max-time 15 -w "\nHTTP=%{http_code}\n" http://127.0.0.1:8787/paper/auto
          echo
          echo "=== LISTENING PORTS ==="
          ss -ltnp | sed -n '1,80p'
          echo
          echo "=== WEB SERVERS ==="
          command -v nginx || true
          command -v caddy || true
          systemctl is-active nginx || true
          systemctl is-active caddy || true
          echo
          echo "=== NGINX SITES ==="
          ls -la /etc/nginx/sites-enabled 2>/dev/null || true
          echo
          echo "=== CADDYFILE ==="
          sed -n '1,160p' /etc/caddy/Caddyfile 2>/dev/null || true
          REMOTE

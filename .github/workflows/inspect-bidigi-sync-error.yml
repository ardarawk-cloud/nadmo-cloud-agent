name: Inspect BIDIGI Products
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-bidigi-sync-error.yml"]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VPS_HOST: 151.243.222.93
      VPS_PORT: "45678"
      VPS_USER: root
      VPS_PASSWORD: ${{ secrets.NADMO_VPS_PASSWORD }}
    steps:
      - name: Read BIDIGI product API
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p ~/.ssh
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts
          sshpass -p "$VPS_PASSWORD" ssh -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" '
            echo "=== HEALTH ==="
            curl -fsS http://127.0.0.1:8792/api/_healthcheck
            echo
            echo "=== PRODUCTS ==="
            curl -fsS "http://127.0.0.1:8792/api/products"
            echo
          '

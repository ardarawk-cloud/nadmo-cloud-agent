name: KAI Independent Lab Checks

on:
  pull_request:
    paths:
      - 'services/kai-independent/**'
      - '.github/workflows/kai-independent-tests.yml'
  push:
    branches:
      - 'feature/kai-independent-lab-v01'
    paths:
      - 'services/kai-independent/**'
      - '.github/workflows/kai-independent-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/kai-independent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check

name: KAI AI Failover Unit Tests
on:
  push:
    paths:
      - "apps/kai-ai-failover/**"
      - ".github/workflows/kai-ai-failover-tests.yml"
  pull_request:
    paths:
      - "apps/kai-ai-failover/**"
      - ".github/workflows/kai-ai-failover-tests.yml"
permissions:
  contents: read
jobs:
  offline-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: node --test apps/kai-ai-failover/tests/failover.test.mjs
